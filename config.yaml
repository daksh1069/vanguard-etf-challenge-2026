# WolfPack - 2026 Vanguard ETF Fall Trading Challenge
# Single source of truth for constants. Nothing numeric gets hardcoded in scripts.

competition:
  team: WolfPack
  members: 4
  accounts: 4
  capital_per_account: 250000
  trading_open:  2026-09-14T09:30:00-04:00
  first_trade_due: 2026-10-03
  trading_close: 2026-11-06T16:00:00-05:00
  workshops: [2026-09-23, 2026-10-12]
  finals: 2026-11-13

platform:                 # StockTrak session settings, brief S3.2
  cash_interest: 0.0      # -> risk-free rate in the Sharpe formula (brief S4.3)
  commission: 10.0        # USD per trade
  min_buy_price: 3.0
  max_weight_single_position: 0.25
  fractional_shares: false
  shorting: false
  margin: false
  max_cash_weight: 0.10   # organizer rule, NOT platform-enforced
  min_trades_per_member: 5

scoring:
  # Sharpe = (mean(daily) - rf) / sd(daily) * sqrt(252), weekends excluded,
  # begins 5 trading days after first trade. brief S4.2
  annualization_factor: 252
  warmup_trading_days: 5
  rf_annual: 0.0

data:
  vanguard_funddetail: "https://investor.vanguard.com/investment-products/list/funddetail/all"
  # ^ public JSON, no auth, no browser. 383 entities (116 ETFs + 267 mutual funds).
  #   Carries: SEC yield, expense ratio, inception date, asset class, risk level,
  #   daily price, YTD, and month-end trailing returns. This is the ONLY source
  #   for SEC yield - it is a fund disclosure, not a market price.
  price_primary: yfinance
  price_crosscheck: stooq
  rates: fred                # DTB4WK / DTB3 for the VBIL, VGUS bill proxies
  history_start: "2019-01-01"
  min_obs_for_covariance: 500

universe:
  # Exclusions are structural, see brief S7.3 / S7.4.
  exclude_municipal: true     # no taxes in a simulation -> strictly dominated
  exclude_target_maturity: true   # VBCA..VBCJ, all inception 2026-03-24
  # Real- vs nominal-yield funds are detected from the feed's yieldNote footnote
  # text ("DOES NOT INCLUDE ANY INCOME ADJUSTMENT..."), not from a hardcoded list.

modelling:
  covariance: ledoit_wolf
  erp_sensitivity: [0.03, 0.045, 0.06]     # brief S11.1, report weights as a range
  rate_shocks_bp: [-100, -50, -25, 25, 50, 100]
  bootstrap: stationary                     # NOT overlapping block, brief S12.4
  bootstrap_draws: 10000
  horizon_trading_days: 40
