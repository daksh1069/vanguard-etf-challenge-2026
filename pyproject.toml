[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vgdata"
version = "1.0.0"
description = "Data and optimisation layer for Team WolfPack's 2026 Vanguard ETF Challenge entry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "cvxpy",
    "requests",
    "yfinance",
    "pandas-datareader",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
